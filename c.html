<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Futuristic Countdown</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00aaff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Countdown" />

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:'Orbitron',sans-serif;
      color:#fff;
    }

    #bg-canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:-2;
      background:#000;
    }

    #overlay{
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at center,
        rgba(0,170,255,0.12),
        rgba(0,0,0,0.92));
      z-index:-1;
    }

    #countdown-panel{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:92%;
      max-width:650px;
      padding:28px;
      border-radius:24px;

      background:rgba(10,10,10,0.35);
      border:1px solid rgba(255,255,255,0.1);

      backdrop-filter:blur(20px);

      box-shadow:
      0 0 30px rgba(0,170,255,0.35),
      inset 0 0 20px rgba(255,255,255,0.03);

      text-align:center;
    }

    h1{
      font-size:2.6rem;
      margin-bottom:18px;
      color:#00cfff;
      letter-spacing:2px;

      text-shadow:
      0 0 10px rgba(0,170,255,0.8),
      0 0 30px rgba(0,170,255,0.5);
    }

    #end-date{
      margin-bottom:22px;
      color:#b8dfff;
      font-size:1rem;
    }

    #linear-progress-container{
      width:100%;
      height:22px;
      border-radius:20px;
      overflow:hidden;

      background:rgba(255,255,255,0.08);

      box-shadow:
      inset 0 0 10px rgba(0,0,0,0.6),
      0 0 10px rgba(0,170,255,0.4);

      margin-bottom:12px;
    }

    #linear-progress{
      height:100%;
      width:0%;

      background:
      linear-gradient(
        90deg,
        #00aaff,
        #00ffee,
        #00aaff
      );

      background-size:200% auto;

      animation:glowMove 3s linear infinite;

      box-shadow:
      0 0 20px rgba(0,255,255,0.7);

      transition:width 1s ease;
    }

    @keyframes glowMove{
      0%{
        background-position:0% center;
      }
      100%{
        background-position:200% center;
      }
    }

    #progress-percentage{
      margin-bottom:24px;
      font-size:1.5rem;
      color:#00e1ff;

      text-shadow:
      0 0 10px rgba(0,225,255,0.8);
    }

    .time-boxes{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }

    .time-box{
      padding:18px 10px;
      border-radius:18px;

      background:rgba(255,255,255,0.04);

      border:1px solid rgba(255,255,255,0.08);

      box-shadow:
      0 0 15px rgba(0,170,255,0.2);

      transition:0.3s;
    }

    .time-box:hover{
      transform:translateY(-4px);
      box-shadow:
      0 0 25px rgba(0,170,255,0.45);
    }

    .time-box span{
      display:block;
      font-size:2.2rem;
      color:#00d5ff;

      text-shadow:
      0 0 15px rgba(0,213,255,0.7);

      margin-bottom:8px;
    }

    .time-box label{
      font-size:0.85rem;
      color:#cfcfcf;
      letter-spacing:1px;
    }

    #footer{
      margin-top:20px;
      font-size:0.75rem;
      color:#8ea8b6;
      opacity:0.7;
    }

    @media(max-width:700px){

      h1{
        font-size:2rem;
      }

      .time-boxes{
        grid-template-columns:repeat(2,1fr);
      }

      .time-box span{
        font-size:1.9rem;
      }
    }

    @media(max-width:420px){

      #countdown-panel{
        padding:22px 18px;
      }

      h1{
        font-size:1.7rem;
      }

      #progress-percentage{
        font-size:1.2rem;
      }

      .time-box span{
        font-size:1.6rem;
      }
    }
  </style>
</head>

<body>

<canvas id="bg-canvas"></canvas>
<div id="overlay"></div>

<div id="countdown-panel">

  <h1></h1>

  <div id="end-date"></div>

  <div id="linear-progress-container">
    <div id="linear-progress"></div>
  </div>

  <div id="progress-percentage">0.000%</div>

  <div class="time-boxes">

    <div class="time-box">
      <span id="days">00</span>
      <label>DAYS</label>
    </div>

    <div class="time-box">
      <span id="hours">00</span>
      <label>HOURS</label>
    </div>

    <div class="time-box">
      <span id="minutes">00</span>
      <label>MINUTES</label>
    </div>

    <div class="time-box">
      <span id="seconds">00</span>
      <label>SECONDS</label>
    </div>

  </div>

  <div id="footer">
    
  </div>

</div>

<script>

  /*************************
   COUNTDOWN CONFIG
  **************************/

  const startDate = new Date("November 20, 2024 00:00:00").getTime();

  const targetDate = new Date(startDate);

  targetDate.setFullYear(targetDate.getFullYear() + 2);
  targetDate.setMonth(targetDate.getMonth() + 6);
  targetDate.setDate(targetDate.getDate() + 55);

  document.getElementById("end-date").innerText =
    "Ends on: " + targetDate.toDateString();

  /*************************
   COUNTDOWN
  **************************/

  function updateCountdown(){

    const now = new Date().getTime();

    const timeLeft = Math.max(targetDate - now, 0);

    if(timeLeft <= 0){

      document.getElementById("countdown-panel").innerHTML = `
        <h1 style="color:#00ffaa;">
          TIME'S UP
        </h1>
      `;

      clearInterval(interval);

      return;
    }

    const days =
      Math.floor(timeLeft / (1000 * 60 * 60 * 24));

    const hours =
      Math.floor((timeLeft % (1000 * 60 * 60 * 24))
      / (1000 * 60 * 60));

    const minutes =
      Math.floor((timeLeft % (1000 * 60 * 60))
      / (1000 * 60));

    const seconds =
      Math.floor((timeLeft % (1000 * 60))
      / 1000);

    document.getElementById("days").innerText =
      String(days).padStart(2,"0");

    document.getElementById("hours").innerText =
      String(hours).padStart(2,"0");

    document.getElementById("minutes").innerText =
      String(minutes).padStart(2,"0");

    document.getElementById("seconds").innerText =
      String(seconds).padStart(2,"0");

    const totalDuration = targetDate - startDate;

    const progress =
      Math.min(
        ((totalDuration - timeLeft) / totalDuration) * 100,
        100
      );

    document.getElementById("progress-percentage").innerText =
      progress.toFixed(3) + "%";

    document.getElementById("linear-progress").style.width =
      progress + "%";
  }

  const interval = setInterval(updateCountdown,1000);

  updateCountdown();

  /*************************
   THREE.JS BACKGROUND
  **************************/

  const canvas =
    document.getElementById("bg-canvas");

  const renderer =
    new THREE.WebGLRenderer({
      canvas,
      antialias:true,
      alpha:true
    });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
  );

  const scene = new THREE.Scene();

  const camera =
    new THREE.PerspectiveCamera(
      60,
      window.innerWidth/window.innerHeight,
      0.1,
      1000
    );

  camera.position.set(0,10,20);

  camera.lookAt(0,0,0);

  /*************************
   GRID
  **************************/

  const gridHelper =
    new THREE.GridHelper(
      60,
      60,
      0x00aaff,
      0x00aaff
    );

  gridHelper.material.transparent = true;
  gridHelper.material.opacity = 0.16;

  scene.add(gridHelper);

  /*************************
   PARTICLES
  **************************/

  const particleCount =
    window.innerWidth < 700 ? 120 : 300;

  const particlesGeometry =
    new THREE.BufferGeometry();

  const particlesArray = [];

  for(let i=0;i<particleCount;i++){

    particlesArray.push(
      (Math.random()-0.5)*50,
      Math.random()*15,
      (Math.random()-0.5)*50
    );
  }

  particlesGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      particlesArray,
      3
    )
  );

  const particlesMaterial =
    new THREE.PointsMaterial({
      color:0x00cfff,
      size:0.13,
      transparent:true,
      opacity:0.85
    });

  const particles =
    new THREE.Points(
      particlesGeometry,
      particlesMaterial
    );

  scene.add(particles);

  /*************************
   ANIMATION
  **************************/

  function animate(){

    requestAnimationFrame(animate);

    gridHelper.position.z += 0.03;

    if(gridHelper.position.z > 20){
      gridHelper.position.z = 0;
    }

    particles.rotation.y += 0.0007;

    renderer.render(scene,camera);
  }

  animate();

  /*************************
   PERFORMANCE
  **************************/

  document.addEventListener(
    "visibilitychange",
    ()=>{

      if(document.hidden){

        renderer.setAnimationLoop(null);

      }else{

        animate();
      }
    }
  );

  /*************************
   RESIZE
  **************************/

  window.addEventListener(
    "resize",
    ()=>{

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      camera.aspect =
        window.innerWidth/window.innerHeight;

      camera.updateProjectionMatrix();
    }
  );

  /*************************
   PWA SERVICE WORKER
  **************************/

  if("serviceWorker" in navigator){

    window.addEventListener(
      "load",
      ()=>{

        navigator.serviceWorker.register(
          "./service-worker.js"
        );
      }
    );
  }

</script>

</body>
</html>
